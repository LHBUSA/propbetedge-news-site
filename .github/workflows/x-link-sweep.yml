name: Sweep Retired X Profile Links

on:
  push:
    paths:
      - '.github/workflows/x-link-sweep.yml'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace retired X links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          url_pattern = re.compile(r'https://(?:www\.)?(?:x\.com|twitter\.com)/propbetedgeai/?', re.I)
          handle_pattern = re.compile(r'@propbetedgeai\b', re.I)
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = url_pattern.sub('https://x.com/MLBHRALERTSPBE', original)
              lines = []
              for line in updated.splitlines(keepends=True):
                  if 'x.com/MLBHRALERTSPBE' in line or 'twitter.com/MLBHRALERTSPBE' in line:
                      line = handle_pattern.sub('@MLBHRALERTSPBE', line)
                  lines.append(line)
              updated = ''.join(lines)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(f' - {path}')

          leftovers = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if url_pattern.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Retired X profile URL remains in: ' + ', '.join(leftovers))
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sweep retired X profile links"
            git push
          fi